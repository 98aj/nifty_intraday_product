[theme]
base = "dark"
primaryColor = "#3dd68c"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#141b23"
textColor = "#f4f6f8"
font = "sans serif"

[server]
headless = true
runOnSave = true
port = 8502
# Serve the live-price snapshot the desk writes so the tile component can poll it
# from the browser (reachable at /app/static/<file>) without a Python rerun.
enableStaticServing = true

[browser]
gatherUsageStats = false
